<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Game Hub</title>
<meta name="description" content="Board Game Hub: Snakes &amp; Ladders, Puli Meka, Ludo, Pachisi, Chess, Sri Krishna property trading, Guess Who, Jigsaw, Tank's 1918, Bubble Struggle 3 and Skywire 2. Play alone, on one screen or in online rooms.">
<meta name="theme-color" content="#b4531f">
<meta property="og:title" content="Board Game Hub"><meta property="og:description" content="Classic and traditional games with online rooms.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">

<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--mut:#6b7280;--acc:#b4531f;--line:#e5dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161b;--card:#1d2027;--ink:#eceae5;--mut:#9aa1ad;--acc:#e8935a;--line:#2b2f38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161b;--card:#1d2027;--ink:#eceae5;--mut:#9aa1ad;--acc:#e8935a;--line:#2b2f38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.brand{font:700 20px Georgia,serif;letter-spacing:.3px;cursor:pointer}.brand b{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.ghost:hover{border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 48px}
h1{font:700 clamp(28px,5vw,40px)/1.15 Georgia,serif;margin:8px 0}
.sub{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--acc))}
.card:not(:disabled):hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.14);border-color:var(--c,var(--acc))}
.card:disabled{opacity:.6;cursor:default}
.ico{font-size:38px;line-height:1;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:var(--mut);font-size:14px}
.tag{position:absolute;top:14px;right:14px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}
.tag.ok{background:var(--c,var(--acc));color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:560px;margin:0 auto}
.opt{margin:18px 0}.opt label{display:block;font-weight:600;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 14px;transition:.15s}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:10px;margin-top:24px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.5}
.foot{color:var(--mut);font-size:13px;margin-top:32px}
code{background:var(--line);padding:1px 6px;border-radius:6px;font-size:12px}
.view{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
@media(max-width:760px){.sl{grid-template-columns:1fr}}
.bw{width:100%;max-width:min(100%,78vh);margin:0 auto;position:relative}
.bw svg{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.tk{transition:transform .17s linear}
.side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.die{font-size:76px;line-height:1;text-align:center;margin:4px 0 10px}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:1px solid transparent;font-size:14px}
.pl.me{border-color:var(--acc);background:var(--line)}.dot{width:14px;height:14px;border-radius:50%}
#log{font-size:13px;color:var(--mut);margin-top:12px;min-height:90px}
.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);color:#fff;border-radius:14px;font:700 28px Georgia,serif;text-align:center}
.tray{position:relative;width:100%;height:150px;border-radius:14px;background:radial-gradient(ellipse at 50% 35%,#2f8553,#1c5535);box-shadow:inset 0 0 0 4px #5b3a1a,inset 0 8px 22px rgba(0,0,0,.55);overflow:hidden;touch-action:none;cursor:grab;user-select:none;perspective:700px;margin-bottom:10px}
.tray.mono{background:transparent;box-shadow:none;height:100%;margin:0}
.tray .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:rgba(255,255,255,.75);pointer-events:none}
.it{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cube i{position:absolute;inset:0;border-radius:16%;background:linear-gradient(145deg,#fffdf6,#e9e2cf);border:1px solid #cfc8b4;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;backface-visibility:hidden}
.cube .f1{transform:translateZ(var(--h))}.cube .f6{transform:rotateY(180deg) translateZ(var(--h))}.cube .f2{transform:rotateY(90deg) translateZ(var(--h))}
.cube .f5{transform:rotateY(-90deg) translateZ(var(--h))}.cube .f3{transform:rotateX(90deg) translateZ(var(--h))}.cube .f4{transform:rotateX(-90deg) translateZ(var(--h))}
.cube i s{display:block}.cube i s.p{background:#1b1b1b;border-radius:50%;margin:10%;box-shadow:inset 0 1px 2px rgba(255,255,255,.3)}.cube i s.r{background:#c62828}
.cube.cw u{position:absolute;inset:6% 20%;border-radius:50%;backface-visibility:hidden}
.cube.cw .o{background:radial-gradient(circle at 40% 35%,#fff7e2,#e6d2a0);box-shadow:inset 0 0 0 2px #b79a62}
.cube.cw .o::after{content:'';position:absolute;left:18%;right:18%;top:44%;height:12%;background:#5b3a1a;border-radius:6px}
.cube.cw .c{transform:rotateX(180deg);background:radial-gradient(circle at 40% 35%,#f4e2b8,#c49a5c);box-shadow:inset 0 0 0 2px #8a6a3a}
.cx{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:820px){.cx{grid-template-columns:1fr}}
.cxb{width:min(100%,max(300px,calc(100vh - 200px)));margin:0 auto}
.cxb .bw{max-width:none;width:100%;position:relative}
.pbar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;margin:6px 0}
.pbar .cap{flex:1;font-size:15px;letter-spacing:-1px;overflow:hidden;white-space:nowrap;font-weight:400}
.clk{font:700 20px ui-monospace,Menlo,monospace;padding:2px 10px;border-radius:8px;background:var(--bg);min-width:84px;text-align:center}
.clk.act{background:var(--acc);color:#fff}.clk.low{outline:2px solid #c62828}
.cx.full{position:fixed;inset:0;z-index:60;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));overflow:auto;align-content:center;grid-template-columns:minmax(0,1fr) 300px}
@media(max-width:820px){.cx.full{grid-template-columns:1fr}}
.cx.full .cxb{width:min(100%,max(300px,calc(100vh - 120px)))}
.stt{font-weight:700;font-size:18px;margin-bottom:10px}
.cbt{display:flex;flex-wrap:wrap;gap:6px}.cbt button{padding:6px 10px;font-size:14px}
.mvl{max-height:300px;overflow:auto;font-size:14px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;margin-top:12px;align-content:start}
.promo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2%;background:rgba(0,0,0,.6);border-radius:10px;z-index:3}
.promo[hidden]{display:none}.promo button{width:19%;aspect-ratio:1;border-radius:12px;border:2px solid var(--acc);background:var(--card);font-size:30px;display:grid;place-items:center;padding:0}
.promo img{height:86%}
.bz{position:relative;width:100%}.bw.zoom{overflow:auto;max-height:80vh}.bw.zoom .bz{width:190%}
.mdice{position:absolute;left:14.5%;top:64.5%;width:25%;height:22%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{display:inline-flex;gap:4px;align-items:center;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink);font-size:12px;white-space:nowrap}
.joinbar{display:flex;gap:8px;align-items:center;margin:0 0 20px;flex-wrap:wrap}
.inp{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:inherit;width:100%}.joinbar .inp{width:150px;text-transform:uppercase;letter-spacing:2px}
.gbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.gname{margin-left:6px}
.view.gfull{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));animation:none}
.gfull .bw{max-width:min(100%,calc(100vh - 110px))}.gfull .cxb{width:min(100%,max(300px,calc(100vh - 150px)))}
.tkw{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}@media(max-width:820px){.tkw{grid-template-columns:1fr}}
.tkc{position:relative;width:min(100%,calc(100vh - 190px));min-width:min(100%,300px);margin:0 auto}.tkc canvas{width:100%;height:auto;display:block;border-radius:12px;background:#000;image-rendering:pixelated;touch-action:none}.bbc canvas{image-rendering:auto}
.gfull .tkc{width:min(100%,calc(100vh - 110px))}
.pad{display:none;grid-column:1/-1;justify-content:space-between;align-items:center;padding:6px 4px}@media(pointer:coarse){.pad{display:flex}}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px}.dp button,.fire{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;color:var(--ink)}.fire{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#fff}
.dp button[data-k=up]{grid-column:2}.dp button[data-k=left]{grid-column:1}.dp button[data-k=right]{grid-column:3}.dp button[data-k=down]{grid-column:2}
.eic{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.eic i{aspect-ratio:1;background:#9e9e9e;border-radius:2px}
.gw{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}@media(max-width:820px){.gw{grid-template-columns:1fr}}
.gwb{display:grid;gap:8px;position:relative}.gwc{position:relative;border:2px solid var(--line);border-radius:10px;padding:4px 4px 6px;background:var(--card);text-align:center;font-size:12px;font-weight:700;cursor:pointer;transition:transform .15s;color:var(--ink)}
.gwc svg{width:100%;height:auto;display:block;border-radius:6px}.gwc.pk:hover{transform:scale(1.04);border-color:var(--acc)}
.gwc .x{display:none;position:absolute;inset:0;place-items:center;font-size:40px;color:#ef5350;font-style:normal;background:#000a;border-radius:8px}.gwc.dn .x{display:grid}.gwc.dn{opacity:.5}
.gwme{display:flex;gap:12px;align-items:center}.gwme .mini{width:64px}.gwme .mini svg{width:100%;border-radius:8px}.glog{font-size:13px;display:grid;gap:4px;max-height:220px;overflow:auto}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.thumbs canvas{width:96px;height:72px;border-radius:8px;border:3px solid transparent;cursor:pointer}.thumbs canvas.on{border-color:var(--acc)}.upl{display:inline-block;padding:8px 12px;cursor:pointer}
.jw{position:relative;width:100%;background:linear-gradient(#cfd8dc,#b0bec5);border-radius:14px;overflow:hidden;touch-action:none;max-height:calc(100vh - 150px)}
.jb{position:absolute;box-shadow:inset 0 0 0 2px #fff6}.jg,.jprev{position:absolute;inset:0;width:100%;height:100%}.jprev{pointer-events:none}
.jp{position:absolute;cursor:grab;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}.jp canvas{width:100%;display:block;pointer-events:none}.jp.drag{cursor:grabbing;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}.jp.ok{pointer-events:none;filter:none}.jp.hint{outline:3px solid #ffd54f;border-radius:50%}
.jhint{position:absolute;border:3px dashed #ffd54f;box-sizing:border-box}
.slots{display:flex;gap:8px}.slot{width:58px;height:58px;border-radius:12px;background:#4a2c14;border:3px solid transparent;display:grid;place-items:center;cursor:pointer}.slot.on{border-color:var(--acc)}.slot img{width:46px}
.tkp{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;max-height:210px;overflow:auto;margin-top:8px}.tkp img{width:100%;aspect-ratio:1;background:#4a2c14;border-radius:8px;cursor:pointer;padding:3px;box-sizing:border-box}.tkp img.sel{outline:3px solid var(--acc)}
.cx.curtain{background:repeating-linear-gradient(90deg,#5a0e0e 0 22px,#7d1919 22px 44px);border-radius:16px;padding:14px}
.cx.curtain .pbar{background:linear-gradient(#efe3c8,#d3c19a);border-color:#8b6d3f;color:#3b2a14}.cx.curtain .side{background:linear-gradient(#efe3c8,#d3c19a);border-color:#8b6d3f;color:#3b2a14}.cx.curtain .mvl span{color:#3b2a14}
.cbt .ghost.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.panel code{background:var(--line);padding:1px 6px;border-radius:6px}
</style></head>

/* ===== HUB FRAMEWORK =====
 Add a game anywhere in this file (or another <script>) with:
 Hub.register({
   id:'chess', name:'Chess', icon:'♞', color:'#6d4c41', tagline:'…', status:'ready'|'soon',
   options:[{key:'players', label:'\ud83d\udc65 Players', type:'seg', choices:[[2,'2'],[3,'3']], def:2},
            {key:'random', label:'Randomize', type:'toggle', def:true}],
   mount(el, opts, api){ …build UI inside el… }   // api.exit() returns to menu, api.restart() remounts
 });
*/
const Hub={games:[],ready:0,room:null,net:null,stage:document.getElementById('stage'),
 FEAT:{s:['\ud83d\udc64','Single-player'],o:['\ud83c\udf10','Online room'],h:['\ud83d\udc65','Shared screen'],c:['\ud83e\udd1d','Co-op']},
 register(g){this.games.push(g);if(this.ready)this.home()},
 pname(){try{return localStorage.getItem('bgh-name')||''}catch(e){return ''}},
 setName(n){try{localStorage.setItem('bgh-name',n)}catch(e){}},
 leave(){if(this.room&&this.room.T)try{this.room.T.close()}catch(e){}this.room=null;this.net=null;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})},
 chips(g){return (g.feat||[]).map(k=>`<span class='chip'>${this.FEAT[k][0]} ${this.FEAT[k][1]}</span>`).join('')},
 home(){this.leave();const s=this.stage;
  s.innerHTML=`<div class='view'><h1>\ud83c\udfb2 Pick a game</h1><p class='sub'>Board games, puzzles and arcade classics from around the world. Play alone, on one screen, or with friends in an online room.</p>
   <div class='joinbar'><span>\ud83d\udd11</span><input id='jc' maxlength='5' placeholder='Room code' autocomplete='off'><button class='btn' id='jb'>Join room</button></div><div class='grid'></div>
   <p class='foot'>\u2728 Adding a game? Call <code>Hub.register({\u2026})</code> and it appears here automatically.</p></div>`;
  const grid=s.querySelector('.grid');
  this.games.forEach(g=>{const b=document.createElement('button');b.className='card';b.style.setProperty('--c',g.color);b.disabled=g.status!=='ready';
   b.innerHTML=`<span class='tag ${g.status==='ready'?'ok':''}'>${g.status==='ready'?'\u25b6 Play':'Soon'}</span><div class='ico'>${g.icon}</div><h3>${g.name}</h3><p>${g.tagline}</p><div class='chips'>${this.chips(g)}</div>`;
   b.onclick=()=>this.setup(g);grid.append(b)});
  document.getElementById('jb').onclick=()=>{const c=document.getElementById('jc').value.trim().toUpperCase();if(c)this.joinPrompt(c)};
  const m=/room=([A-Za-z0-9]+)/.exec(location.hash);if(m&&!this.hashDone){this.hashDone=1;document.getElementById('jc').value=m[1].toUpperCase();this.joinPrompt(m[1].toUpperCase())}},
 joinPrompt(code){this.stage.innerHTML=`<div class='panel view'><div class='ico'>\ud83d\udd11</div><h1 style='font-size:26px'>Join room ${code}</h1><div class='opt'><label>\ud83d\udc64 Your name</label><input id='nm' class='inp' value='${this.pname()}' placeholder='Player'></div>
   <div class='opt'><label>\ud83d\udce1 Connection</label><div class='seg' id='lk'></div></div><div class='row'><button class='btn' id='go'>\ud83c\udf10 Join</button><button class='ghost' id='back'>Back</button></div></div>`;
  let kind='net';const lk=document.getElementById('lk'),dr=()=>{lk.innerHTML='';[['net','Internet'],['tab','Same device (tabs)']].forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;if(v===kind)b.className='on';b.onclick=()=>{kind=v;dr()};lk.append(b)})};dr();
  document.getElementById('back').onclick=()=>this.home();document.getElementById('go').onclick=()=>{this.setName(document.getElementById('nm').value.trim());this.join(code,kind)}},
 setup(g){const o={};(g.options||[]).forEach(x=>o[x.key]=x.def);o.play='local';o.link='net';
  this.stage.innerHTML=`<div class='panel view'><div class='ico'>${g.icon}</div><h1 style='font-size:28px'>${g.name}</h1><p class='sub' style='margin-bottom:6px'>${g.tagline}</p><div class='chips'>${this.chips(g)}</div><div id='opts'></div>
   <div class='row'><button class='btn' id='go'>\u25b6 Start game</button><button class='ghost' id='back'>\u2190 Back</button></div></div>`;
  const box=document.getElementById('opts'),go=document.getElementById('go');let nm,lkEl;
  const upd=()=>{const r=o.play==='room';if(nm)nm.style.display=lkEl.style.display=r?'':'none';go.textContent=r?'\ud83c\udf10 Create room':'\u25b6 Start game'};
  const seg=(label,key,ch)=>{const d=document.createElement('div');d.className='opt';d.innerHTML=`<label>${label}</label><div class='seg'></div>`;const sg=d.querySelector('.seg');
   const dr=()=>{sg.innerHTML='';ch.forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;if(String(o[key])===String(v))b.className='on';b.onclick=()=>{o[key]=v;dr();if(key==='play')upd()};sg.append(b)})};dr();box.append(d);return d};
  if(g.online)seg('\ud83c\udfae Play mode','play',[['local','On this device'],['room','\ud83c\udf10 Online room']]);
  (g.options||[]).forEach(x=>{if(x.type==='custom'){const d=document.createElement('div');d.className='opt';d.innerHTML=`<label>${x.label}</label><div class='cst'></div>`;box.append(d);x.render(d.querySelector('.cst'),o);return}
   seg(x.label,x.key,x.type==='toggle'?[[true,'On'],[false,'Off']]:x.choices)});
  if(g.online){nm=document.createElement('div');nm.className='opt';nm.innerHTML=`<label>\ud83d\udc64 Your name</label><input id='pn' class='inp' value='${this.pname()}' placeholder='Player'>`;box.append(nm);lkEl=seg('\ud83d\udce1 Connection','link',[['net','Internet'],['tab','Same device (tabs)']])}
  upd();document.getElementById('back').onclick=()=>this.home();
  go.onclick=()=>{const pn=document.getElementById('pn');if(pn)this.setName(pn.value.trim());o.play==='room'?this.host(g,o):this.start(g,o,null)}},
 start(g,o,net){this.net=net;const run=()=>{this.stage.innerHTML='';const el=document.createElement('div');el.className='view gview';
   el.innerHTML=`<div class='gbar'><button class='ghost' id='x'>\u2190 Menu</button>${net?'':`<button class='ghost' id='r'>\u21bb New game</button>`}<button class='ghost' id='fs'>\u26f6 Full screen</button><strong class='gname'>${g.icon} ${g.name}</strong>${net?`<span class='chip'>\ud83c\udf10 ${this.room.code} \u00b7 ${net.names[net.seat]}</span>`:''}</div><div id='g'></div>`;
   this.stage.append(el);el.querySelector('#x').onclick=()=>this.home();const r=el.querySelector('#r');if(r)r.onclick=run;
   const fs=el.querySelector('#fs');fs.onclick=()=>{const on=!el.classList.contains('gfull');el.classList.toggle('gfull',on);fs.textContent=on?'\u2715 Exit full screen':'\u26f6 Full screen';
