<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Game Hub</title>
<meta name="description" content="Board Game Hub: Snakes &amp; Ladders, Puli Meka, Ludo, Pachisi/Chausar, Chess and Sri Krishna property trading. Playable in the browser, no install.">
<meta name="theme-color" content="#b4531f">
<meta property="og:title" content="Board Game Hub"><meta property="og:description" content="Classic and traditional board games, playable online.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">

<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--mut:#6b7280;--acc:#b4531f;--line:#e5dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161b;--card:#1d2027;--ink:#eceae5;--mut:#9aa1ad;--acc:#e8935a;--line:#2b2f38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161b;--card:#1d2027;--ink:#eceae5;--mut:#9aa1ad;--acc:#e8935a;--line:#2b2f38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.brand{font:700 20px Georgia,serif;letter-spacing:.3px;cursor:pointer}.brand b{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.ghost:hover{border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 48px}
h1{font:700 clamp(28px,5vw,40px)/1.15 Georgia,serif;margin:8px 0}
.sub{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--acc))}
.card:not(:disabled):hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.14);border-color:var(--c,var(--acc))}
.card:disabled{opacity:.6;cursor:default}
.ico{font-size:38px;line-height:1;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:var(--mut);font-size:14px}
.tag{position:absolute;top:14px;right:14px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}
.tag.ok{background:var(--c,var(--acc));color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:560px;margin:0 auto}
.opt{margin:18px 0}.opt label{display:block;font-weight:600;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 14px;transition:.15s}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:10px;margin-top:24px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.5}
.foot{color:var(--mut);font-size:13px;margin-top:32px}
code{background:var(--line);padding:1px 6px;border-radius:6px;font-size:12px}
.view{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
@media(max-width:760px){.sl{grid-template-columns:1fr}}
.bw{width:100%;max-width:min(100%,78vh);margin:0 auto;position:relative}
.bw svg{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.tk{transition:transform .17s linear}
.side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.die{font-size:76px;line-height:1;text-align:center;margin:4px 0 10px}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:1px solid transparent;font-size:14px}
.pl.me{border-color:var(--acc);background:var(--line)}.dot{width:14px;height:14px;border-radius:50%}
#log{font-size:13px;color:var(--mut);margin-top:12px;min-height:90px}
.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);color:#fff;border-radius:14px;font:700 28px Georgia,serif;text-align:center}
.tray{position:relative;width:100%;height:150px;border-radius:14px;background:radial-gradient(ellipse at 50% 35%,#2f8553,#1c5535);box-shadow:inset 0 0 0 4px #5b3a1a,inset 0 8px 22px rgba(0,0,0,.55);overflow:hidden;touch-action:none;cursor:grab;user-select:none;perspective:700px;margin-bottom:10px}
.tray.mono{background:transparent;box-shadow:none;height:100%;margin:0}
.tray .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:rgba(255,255,255,.75);pointer-events:none}
.it{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cube i{position:absolute;inset:0;border-radius:16%;background:linear-gradient(145deg,#fffdf6,#e9e2cf);border:1px solid #cfc8b4;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;backface-visibility:hidden}
.cube .f1{transform:translateZ(var(--h))}.cube .f6{transform:rotateY(180deg) translateZ(var(--h))}.cube .f2{transform:rotateY(90deg) translateZ(var(--h))}
.cube .f5{transform:rotateY(-90deg) translateZ(var(--h))}.cube .f3{transform:rotateX(90deg) translateZ(var(--h))}.cube .f4{transform:rotateX(-90deg) translateZ(var(--h))}
.cube i s{display:block}.cube i s.p{background:#1b1b1b;border-radius:50%;margin:10%;box-shadow:inset 0 1px 2px rgba(255,255,255,.3)}.cube i s.r{background:#c62828}
.cube.cw u{position:absolute;inset:6% 20%;border-radius:50%;backface-visibility:hidden}
.cube.cw .o{background:radial-gradient(circle at 40% 35%,#fff7e2,#e6d2a0);box-shadow:inset 0 0 0 2px #b79a62}
.cube.cw .o::after{content:'';position:absolute;left:18%;right:18%;top:44%;height:12%;background:#5b3a1a;border-radius:6px}
.cube.cw .c{transform:rotateX(180deg);background:radial-gradient(circle at 40% 35%,#f4e2b8,#c49a5c);box-shadow:inset 0 0 0 2px #8a6a3a}
.cx{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:820px){.cx{grid-template-columns:1fr}}
.cxb{width:min(100%,max(300px,calc(100vh - 200px)));margin:0 auto}
.cxb .bw{max-width:none;width:100%;position:relative}
.pbar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;margin:6px 0}
.pbar .cap{flex:1;font-size:15px;letter-spacing:-1px;overflow:hidden;white-space:nowrap;font-weight:400}
.clk{font:700 20px ui-monospace,Menlo,monospace;padding:2px 10px;border-radius:8px;background:var(--bg);min-width:84px;text-align:center}
.clk.act{background:var(--acc);color:#fff}.clk.low{outline:2px solid #c62828}
.cx.full{position:fixed;inset:0;z-index:60;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));overflow:auto;align-content:center;grid-template-columns:minmax(0,1fr) 300px}
@media(max-width:820px){.cx.full{grid-template-columns:1fr}}
.cx.full .cxb{width:min(100%,max(300px,calc(100vh - 120px)))}
.stt{font-weight:700;font-size:18px;margin-bottom:10px}
.cbt{display:flex;flex-wrap:wrap;gap:6px}.cbt button{padding:6px 10px;font-size:14px}
.mvl{max-height:300px;overflow:auto;font-size:14px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;margin-top:12px;align-content:start}
.promo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2%;background:rgba(0,0,0,.6);border-radius:10px;z-index:3}
.promo[hidden]{display:none}.promo button{width:19%;aspect-ratio:1;border-radius:12px;border:2px solid var(--acc);background:var(--card);font-size:30px;display:grid;place-items:center;padding:0}
.promo img{height:86%}
.bz{position:relative;width:100%}.bw.zoom{overflow:auto;max-height:80vh}.bw.zoom .bz{width:190%}
.mdice{position:absolute;left:14.5%;top:64.5%;width:25%;height:22%}
</style></head>

/* ===== HUB FRAMEWORK =====
 Add a game anywhere in this file (or another <script>) with:
 Hub.register({
   id:'chess', name:'Chess', icon:'♞', color:'#6d4c41', tagline:'…', status:'ready'|'soon',
   options:[{key:'players', label:'Players', type:'seg', choices:[[2,'2'],[3,'3']], def:2},
            {key:'random', label:'Randomize', type:'toggle', def:true}],
   mount(el, opts, api){ …build UI inside el… }   // api.exit() returns to menu, api.restart() remounts
 });
*/
const Hub={games:[],
  register(g){this.games.push(g);if(this.ready)this.home()},
  stage:document.getElementById('stage'),
  home(){this.ready=1;const s=this.stage;
    s.innerHTML=`<div class="view"><h1>Pick a game</h1><p class="sub">Classic board games from around the world, playable right here. Pass the device for hot-seat play.</p><div class="grid"></div>
    <p class="foot">Adding a game? Call <code>Hub.register({…})</code> — it appears here automatically.</p></div>`;
    const grid=s.querySelector('.grid');
    this.games.forEach(g=>{const b=document.createElement('button');b.className='card';b.style.setProperty('--c',g.color);
      b.disabled=g.status!=='ready';

 s+=`<rect x='${a-.3}' y='${a-.3}' width='${l+.6}' height='${l+.6}' fill='#a06a35' stroke='#3a200d' stroke-width='.4'/><rect x='${a}' y='${a}' width='${l}' height='${l}' fill='url(#lt)' stroke='#2b1608' stroke-width='.6'/>
 <rect x='${a+1.2}' y='${a+1.2}' width='${l-2.4}' height='${l-2.4}' fill='none' stroke='${GOLD}' stroke-width='.2' stroke-dasharray='.6 .5' opacity='.7'/>
 <g transform='rotate(-45 ${T/2} ${T/2})'><rect x='${T/2-31}' y='${T/2-9.5}' width='62' height='19' fill='none' stroke='url(#gf)' stroke-width='.5'/><rect x='${T/2-29.8}' y='${T/2-8.3}' width='59.6' height='16.6' fill='none' stroke='url(#gf)' stroke-width='.2'/>
 <text x='${T/2}' y='${T/2+3.2}' font-size='10.5' font-weight='700' font-family="${F}" text-anchor='middle' fill='url(#gf)' stroke='#7a5a14' stroke-width='.12'>\u0c36\u0c4d\u0c30\u0c40 Krishna</text>
 <text x='${T/2}' y='${T/2+7}' font-size='2.1' font-family="${F}" text-anchor='middle' fill='${GOLD}'>The Fast-Dealing Property Trading Game</text></g>`;
 const card=(x,y,t1,t2)=>`<g transform='translate(${x} ${y}) rotate(45)'><rect x='-10' y='-6' width='20' height='12' rx='.8' fill='#4a1224' stroke='${GOLD}' stroke-width='.35'/><rect x='-9' y='-5' width='18' height='10' rx='.5' fill='none' stroke='${GOLD}' stroke-width='.2' stroke-dasharray='.5 .4'/>${tx(t1,0,-.6,2)}${t2?tx(t2,0,2,2):''}</g>`;
 s+=card(T*.3,T*.3,'COMMUNITY','CHEST')+card(T*.7,T*.72,'CHANCE','');return s})();
Hub.register({id:'monopoly',name:'\u0c36\u0c4d\u0c30\u0c40 Krishna',icon:'\ud83e\udd9a',color:'#8d5a2b',status:'ready',
 tagline:`A luxury wooden property-trading board: gold-foil lettering, leather centre. Flick the dice, buy, trade and bankrupt your rivals.`,
 options:[{key:'players',label:'Players',type:'seg',choices:[[2,'2'],[3,'3'],[4,'4']],def:2},{key:'cash',label:'Starting cash',type:'seg',choices:[[1000,'$1000'],[1500,'$1500'],[2000,'$2000']],def:1500}],
 mount(el,o,api){const n=+o.players,P=Array.from({length:n},()=>({cash:+o.cash,pos:0,jail:0,out:false})),own=Array(40).fill(-1);
  let t=0,ph='roll',dbl=0,d=[1,1],over=null,busy=false;const lines_=[];
  el.innerHTML=`<div class='sl'><div class='bw' id='bw'><div class='bz'><svg viewBox='-4 -4 ${T+8} ${T+8}' xmlns='http://www.w3.org/2000/svg'></svg><div class='mdice' id='dice'></div></div></div>
   <div class='side'><div style='display:flex;flex-direction:column;gap:8px'><button class='btn' id='roll'>Roll dice</button><button class='btn' id='buy' style='display:none'></button><button class='ghost' id='skip' style='display:none'>Skip</button><button class='ghost' id='pay' style='display:none'>Pay $50 to leave jail</button><button class='ghost' id='trd'>Trade properties</button><button class='ghost' id='zm'>\ud83d\udd0d Zoom board</button></div>
   <div id='tp'></div><div id='st' style='margin:12px 0;font-weight:600'></div><div id='pls'></div><div id='log'></div></div></div>`;
  const $=s=>el.querySelector(s),svg=$('svg'),say=x=>{lines_.unshift(x);$('#log').innerHTML=lines_.slice(0,5).map(q=>`<div>${q}</div>`).join('')};
  const D=Hub.Dice($('#dice'),2,{cls:'mono',hint:false,onFlick:(x,y)=>roll(x,y)});
  const rent=i=>{const s=SP[i],ow=own[i];if(s[1]==='P'){const all=SP.every((q,j)=>q[4]!==s[4]||own[j]===ow);return s[3]*(all?2:1)}
   if(s[1]==='R')return 25<<(SP.filter((q,j)=>q[1]==='R'&&own[j]===ow).length-1);return (d[0]+d[1])*(SP.filter((q,j)=>q[1]==='U'&&own[j]===ow).length>1?10:4)};
  const OF=[[-2,-1.8],[2,-1.8],[-2,2],[2,2]];
  const draw=()=>{let s=BDS;own.forEach((ow,i)=>{if(ow>=0)s+=`<g transform='${GT[i].tr}'><rect x='${GT[i].w/2-2.6}' y='${C/2-2.3}' width='2.1' height='1.6' rx='.3' fill='${PC[ow]}' stroke='#000' stroke-width='.15'/></g>`});
   P.forEach((p,i)=>{if(p.out)return;const g=GT[p.pos],x=g.cx+OF[i][0],y=g.cy+OF[i][1];
    s+=`<g transform='translate(${x} ${y})' fill='url(#tk${i})' stroke='#2b1c08' stroke-width='.18'><ellipse cy='1.3' rx='1.6' ry='.65'/><path d='M-1.05 1.2Q0-1.6 1.05 1.2z'/><circle cy='-1.15' r='.9'/></g>`});
   svg.innerHTML=s;const p=P[t],sp=SP[p.pos];
   $('#roll').style.display=ph==='roll'?'':'none';$('#buy').style.display=$('#skip').style.display=ph==='buy'?'':'none';$('#pay').style.display=ph==='roll'&&p.jail&&p.cash>=50?'':'none';
   $('#trd').style.display=ph==='roll'&&over==null?'':'none';if(ph==='buy')$('#buy').textContent=`Buy ${nm(sp)} \u2014 $${sp[2]}`;
   $('#st').textContent=over!=null?`${NM[over]} wins!`:`${NM[t]}\u2019s turn${p.jail?' (in jail)':''}`;
   $('#pls').innerHTML=P.map((q,i)=>`<div class='pl ${i===t&&over==null?'me':''}' style='${q.out?'opacity:.4':''}'><span class='dot' style='background:${PC[i]}'></span>${NM[i]}<span style='margin-left:auto'>$${q.cash} \u00b7 ${own.filter(x=>x===i).length} props</span></div>`).join('');
   if(over!=null&&!$('.win')){const w=document.createElement('div');w.className='win';w.innerHTML=`\ud83c\udfc6 ${NM[over]} wins!<button class='btn'>Play again</button>`;w.querySelector('button').onclick=api.restart;$('#bw').append(w)}};
  const jail=p=>{p.pos=10;p.jail=3;say(`${NM[t]} goes to jail`)};
  const fin=()=>{const p=P[t];if(p.cash<0){p.out=true;own.forEach((x,i)=>{if(x===t)own[i]=-1});say(`${NM[t]} is bankrupt!`)}
   const alive=P.map((q,i)=>i).filter(i=>!P[i].out);if(alive.length===1){over=alive[0];ph='over';draw();return}
   if(!(d[0]===d[1]&&!p.jail&&!p.out)){do{t=(t+1)%n}while(P[t].out);dbl=0}ph='roll';draw()};
  const land=async()=>{const p=P[t],s=SP[p.pos],ty=s[1];
   if('PRU'.includes(ty)){const ow=own[p.pos];
    if(ow<0){if(p.cash>=s[2]){ph='buy';draw();return}}
    else if(ow!==t){const r=rent(p.pos);p.cash-=r;P[ow].cash+=r;say(`${NM[t]} pays $${r} rent to ${NM[ow]}`)}}
   else if(ty==='T'){p.cash-=s[2];say(`${NM[t]} pays $${s[2]} tax`)}
   else if(ty==='X')jail(p);
   else if(ty==='C'||ty==='H'){const c=CARDS[rnd(0,CARDS.length-1)];say(`${ty==='H'?'Chance':'Chest'}: ${c[0]}`);
    if(c[1]==='cash')p.cash+=c[2];else if(c[1]==='jail')jail(p);else{if(c[2]<p.pos)p.cash+=200;p.pos=c[2];draw();await sl(300);return land()}}
   fin()};
  async function roll(fx,fy){if(ph!=='roll'||busy||over!=null)return;busy=true;const p=P[t];
   d=[rnd(1,6),rnd(1,6)];await D.throw(d,fx,fy);dbl=d[0]===d[1]?dbl+1:0;busy=false;
   if(p.jail){if(d[0]===d[1]){p.jail=0;say(`${NM[t]} rolled doubles and leaves jail`)}else if(--p.jail===0){p.cash-=50;say(`${NM[t]} pays $50 and leaves jail`)}else{say(`${NM[t]} stays in jail`);fin();return}}
   else if(dbl===3){say(`Three doubles: ${NM[t]} goes to jail`);jail(p);fin();return}
   busy=true;for(let i=0;i<d[0]+d[1];i++){p.pos=(p.pos+1)%40;if(p.pos===0){p.cash+=200;say(`${NM[t]} passes GO: +$200`)}draw();await sl(110)}
   busy=false;land()}
  $('#roll').onclick=()=>roll();
  $('#zm').onclick=()=>$('#bw').classList.toggle('zoom');
  $('#buy').onclick=()=>{const p=P[t],s=SP[p.pos];p.cash-=s[2];own[p.pos]=t;say(`${NM[t]} buys ${nm(s)}`);fin()};
  $('#skip').onclick=fin;
  $('#trd').onclick=()=>{const tp=$('#tp'),me=t;if(tp.innerHTML){tp.innerHTML='';return}
   const oth=P.map((q,i)=>i).filter(i=>i!==me&&!P[i].out),inp=`font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:inherit`;
   tp.innerHTML=`<div style='border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;display:grid;gap:8px'><select id='tw' style='${inp}'>${oth.map(i=>`<option value='${i}'>${NM[i]}</option>`).join('')}</select>
    <select id='td' style='${inp}'><option value='s'>I sell a property</option><option value='b'>I buy a property</option></select><select id='tpr' style='${inp}'></select>
    <input id='tpc' type='number' min='0' value='100' style='${inp}'><button class='btn' id='tof'>Make offer</button><div id='tm'></div></div>`;
   const fill=()=>{const w=+$('#tw').value,who=$('#td').value==='s'?me:w;
    $('#tpr').innerHTML=SP.map((s,i)=>i).filter(i=>own[i]===who).map(i=>`<option value='${i}'>${nm(SP[i])}</option>`).join('')||`<option value=''>(none owned)</option>`};
   $('#tw').onchange=$('#td').onchange=fill;fill();
   $('#tof').onclick=()=>{const w=+$('#tw').value,sell=$('#td').value==='s',pr=$('#tpr').value,pc=+$('#tpc').value;if(pr===''||!(pc>=0))return;
    const buyer=sell?w:me,seller=sell?me:w,i=+pr;if(P[buyer].cash<pc){$('#tm').textContent=`${NM[buyer]} cannot afford $${pc}`;return}
    $('#tm').innerHTML=`<div style='margin-bottom:6px'>${NM[w]}: ${sell?`buy ${nm(SP[i])} from ${NM[me]}`:`sell ${nm(SP[i])} to ${NM[me]}`} for $${pc}?</div><button class='btn' id='ta'>Accept</button> <button class='ghost' id='tn'>Decline</button>`;
    $('#ta').onclick=()=>{P[buyer].cash-=pc;P[seller].cash+=pc;own[i]=buyer;say(`${NM[seller]} sells ${nm(SP[i])} to ${NM[buyer]} for $${pc}`);tp.innerHTML='';draw()};
    $('#tn').onclick=()=>{$('#tm').textContent='Offer declined.'}}};
  $('#pay').onclick=()=>{P[t].cash-=50;P[t].jail=0;say(`${NM[t]} pays $50 to leave jail`);draw()};
  draw();say(`${NM[0]} starts. Flick the dice or tap Roll!`)}});
}
